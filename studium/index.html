<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0c0a08">
<title>Studium 2027 · Veronika Horytska</title>
<style>
html,body{height:100%;margin:0;background:#0c0a08;color:#ece5d8;font-family:Georgia,serif}main{min-height:100%;display:grid;place-items:center;padding:24px;text-align:center}p{margin:10px 0;color:#a79e91}small{color:#786f64}i{display:inline-block;width:24px;height:24px;border:2px solid #5c5147;border-top-color:#d67f48;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body><main id="loading"><div><i aria-hidden="true"></i><p>Studiennavigator wird geladen …</p><small>Veronika Horytska · Studium 2027</small></div></main>
<script>
(async()=>{try{
 const files=Array.from({length:14},(_,i)=>`./bundle/b${String(i).padStart(2,'0')}.txt`);
 const parts=await Promise.all(files.map(async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(`${u}: ${r.status}`);return r.text()}));
 const s=parts.join('').replace(/\s/g,''); const bin=atob(s); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
 if(!('DecompressionStream' in window))throw new Error('Dieser Browser unterstützt die benötigte Dekomprimierung nicht. Bitte Safari/Chrome/Firefox aktualisieren.');
 const ds=new DecompressionStream('gzip'); const text=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
 document.open();document.write(text);document.close();
}catch(e){console.error(e);document.getElementById('loading').innerHTML=`<div><p>Die Studienseite konnte nicht geladen werden.</p><small>${String(e.message||e)}</small><p><button onclick="location.reload()">Neu laden</button></p></div>`}})();
</script></body></html>
